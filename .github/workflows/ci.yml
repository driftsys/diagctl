name: ci

# CI installs tools and then runs the justfile recipes. It holds no copy of any
# gate command: each is defined once, in the justfile, and both sides run that
# definition. Every tool install runs under `set -o pipefail` and ends by
# running the tool it installed, so a failed download fails its own step.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JUST_VERSION: 1.38.0

jobs:
  # Connective tissue (prim), shell scripts, install test, commit messages.
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Lint the PR's own commits, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: install just
        run: |
          set -o pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version
      - name: install prim
        run: |
          set -o pipefail
          curl -fsSL https://raw.githubusercontent.com/driftsys/prim/main/install.sh | bash \
            || cargo install --git https://github.com/driftsys/prim --locked
          command -v prim
        env:
          PRIM_INSTALL_DIR: /usr/local/bin
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: install git-std
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          curl -fsSL https://raw.githubusercontent.com/driftsys/git-std/main/install.sh | bash \
            || cargo install --git https://github.com/driftsys/git-std git-std --locked
          command -v git-std
        env:
          GIT_STD_INSTALL_DIR: /usr/local/bin
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: just check
      - run: just shellcheck
      - run: just install-test
      - name: lint commits
        if: github.event_name == 'pull_request'
        run: just lint-commits ${{ github.base_ref }}

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # rustup applies rust-toolchain.toml (channel + components).
      - name: install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - run: just toolchain-check
      - run: just fmt-check
      - run: just compile
      - run: just test
      - run: just lint

  # Compile-verify the static musl release targets on every PR, so a
  # musl-incompatible dependency is caught here instead of at release time.
  # Uses the same cargo-zigbuild cross-compiler as the cargo-dist release build.
  musl-build:
    name: musl static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-zigbuild --version 0.24.1 --locked
      - run: cargo zigbuild --release --target x86_64-unknown-linux-musl
      - run: cargo zigbuild --release --target aarch64-unknown-linux-musl
